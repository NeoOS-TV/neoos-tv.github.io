<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>neoos-tv | Projekt-Hub</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --text-muted: #8b949e;
            --accent-color: #58a6ff;
            --border-color: #30363d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        header h1 {
            color: #fff;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
            text-decoration: none;
            color: inherit;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
        }

        .card h2 {
            font-size: 1.3rem;
            color: var(--accent-color);
            margin: 0 0 0.5rem 0;
        }

        .card p {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin: 0 0 1.5rem 0;
            line-height: 1.4;
            flex-grow: 1;
        }

        .card .badge {
            font-size: 0.8rem;
            background-color: #21262d;
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 20px;
            align-self: flex-start;
        }

        .loading, .error {
            text-align: center;
            grid-column: 1 / -1;
            padding: 3rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <h1>NeoOS Portfolio</h1>
        <p>Eine Übersicht meiner GitHub Pages Projekte</p>
    </header>

    <div class="container">
        <div class="grid" id="project-grid">
            <div class="loading">Projekte werden geladen...</div>
        </div>
    </div>

    <script>
        async function loadProjects() {
            const grid = document.getElementById('project-grid');
            try {
                // Holt die von der GitHub Action generierte JSON-Datei
                const response = await fetch('./index.json');
                if (!response.ok) throw new Error('JSON konnte nicht geladen werden');
                
                const projects = await response.json();
                
                if (projects.length === 0) {
                    grid.innerHTML = '<div class="loading">Keine Projekte mit GitHub Pages gefunden.</div>';
                    return;
                }

                grid.innerHTML = ''; // Lade-Text entfernen

                projects.forEach(project => {
                    const card = document.createElement('a');
                    card.className = 'card';
                    card.href = project.url;
                    card.target = '_blank'; // Öffnet Link in neuem Tab

                    // Falls keine Beschreibung da ist, Platzhalter setzen
                    const description = project.description || 'Keine Beschreibung vorhanden.';

                    card.innerHTML = `
                        <div>
                            <h2>${project.name}</h2>
                            <p>${description}</p>
                        </div>
                        <span class="badge">Ansehen →</span>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                grid.innerHTML = '<div class="error">Fehler beim Laden der Projekte. Stelle sicher, dass die index.json bereits existiert.</div>';
            }
        }

        // Startet den Ladevorgang
        loadProjects();
    </script>
</body>
</html>
