name: Index GitHub Pages Repos

on:
  schedule:
    - cron: '0 0 * * *' # Läuft jeden Tag um Mitternacht
  workflow_dispatch: # Erlaubt es dir, die Action jederzeit manuell zu starten

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Fetch Repositories and Filter Pages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Holt alle öffentlichen Repos des Users/der Orga via GitHub API
        REPOS_JSON=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/users/${{ github.repository_owner }}/repos?per_page=100")
        
        # Filtert Repos, bei denen "has_pages" true ist, und schließt das Haupt-Repo aus
        echo "$REPOS_JSON" | jq '[.[] | select(.has_pages == true and .name != "${{ github.event.repository.name }}") | {name: .name, description: .description, url: "https://${{ github.repository_owner }}.github.io/\(.name)"}]' > index.json

    - name: Commit and Push index.json
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add index.json
        
        # Nur committen, wenn sich die index.json auch wirklich verändert hat
        if git diff --quiet && git diff --staged --quiet; then
          echo "Keine Änderungen an der index.json"
        else
          git commit -m "Automatisches Update der index.json [skip ci]"
          git push
        fi
